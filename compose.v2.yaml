name: lastest-v2

services:
  api:
    image: "${LASTEST_IMAGE:?set LASTEST_IMAGE to a published image digest, e.g. ghcr.io/owner/lastest@sha256:...}"
    command: ["serve"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LASTEST_DATA_DIR: /data
      LASTEST_BIND: 0.0.0.0:8080
      LASTEST_SECURE_COOKIES: "${LASTEST_SECURE_COOKIES:-true}"
      LASTEST_INTERNAL_RANGES: "${LASTEST_INTERNAL_RANGES:-}"
      LASTEST_LOG_LEVEL: "${LASTEST_LOG_LEVEL:-info}"
      LASTEST_CERTSPOTTER_TOKEN: "${LASTEST_CERTSPOTTER_TOKEN:-}"
      LASTEST_CENSYS_API_ID: "${LASTEST_CENSYS_API_ID:-}"
      LASTEST_CENSYS_API_SECRET: "${LASTEST_CENSYS_API_SECRET:-}"
      LASTEST_NMAP_PATH: "${LASTEST_NMAP_PATH:-}"
    ports:
      - "127.0.0.1:${LASTEST_PORT:-8080}:8080"
    volumes:
      - lastest-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: "${LASTEST_IMAGE:?set LASTEST_IMAGE to a published image digest, e.g. ghcr.io/owner/lastest@sha256:...}"
    command: ["worker"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LASTEST_DATA_DIR: /data
      LASTEST_BIND: 127.0.0.1:8080
      LASTEST_INTERNAL_RANGES: "${LASTEST_INTERNAL_RANGES:-}"
      LASTEST_LOG_LEVEL: "${LASTEST_LOG_LEVEL:-info}"
      LASTEST_CERTSPOTTER_TOKEN: "${LASTEST_CERTSPOTTER_TOKEN:-}"
      LASTEST_CENSYS_API_ID: "${LASTEST_CENSYS_API_ID:-}"
      LASTEST_CENSYS_API_SECRET: "${LASTEST_CENSYS_API_SECRET:-}"
      LASTEST_NMAP_PATH: "${LASTEST_NMAP_PATH:-}"
    volumes:
      - lastest-data:/data
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  lastest-data:
    name: lastest-v2-data
