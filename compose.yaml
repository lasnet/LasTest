name: lastest

services:
  api:
    image: "${LASTEST_IMAGE:-ghcr.io/lasnet/lastest:dev}"
    command: ["serve"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LASTEST_DATA_DIR: /data
      LASTEST_DNS_SERVER: "${LASTEST_DNS_SERVER:-}"
      LASTEST_MAX_CONCURRENT_JOBS: "${LASTEST_MAX_CONCURRENT_JOBS:-4}"
      LASTEST_BIND: 0.0.0.0:8080
      LASTEST_SECURE_COOKIES: "${LASTEST_SECURE_COOKIES:-false}"
      LASTEST_INTERNAL_RANGES: "${LASTEST_INTERNAL_RANGES:-}"
      LASTEST_LOG_LEVEL: "${LASTEST_LOG_LEVEL:-info}"
      LASTEST_CERTSPOTTER_TOKEN: "${LASTEST_CERTSPOTTER_TOKEN:-}"
      LASTEST_CENSYS_API_ID: "${LASTEST_CENSYS_API_ID:-}"
      LASTEST_CENSYS_API_SECRET: "${LASTEST_CENSYS_API_SECRET:-}"
      LASTEST_CENSYS_PAT: "${LASTEST_CENSYS_PAT:-}"
      LASTEST_CENSYS_ORGANIZATION_ID: "${LASTEST_CENSYS_ORGANIZATION_ID:-}"
      LASTEST_CENSYS_PLATFORM_URL: "${LASTEST_CENSYS_PLATFORM_URL:-}"
      LASTEST_NMAP_PATH: "${LASTEST_NMAP_PATH:-}"
      LASTEST_SUBFINDER_PATH: "${LASTEST_SUBFINDER_PATH:-/usr/local/bin/subfinder}"
      LASTEST_DNSX_PATH: "${LASTEST_DNSX_PATH:-/usr/local/bin/dnsx}"
      LASTEST_DNS_WORDLIST_TIMEOUT_SECONDS: "${LASTEST_DNS_WORDLIST_TIMEOUT_SECONDS:-${LASTEST_DNSMAP_TIMEOUT_SECONDS:-7200}}"
      LASTEST_DNS_WORDLIST_RESOLVER: "${LASTEST_DNS_WORDLIST_RESOLVER:-1.1.1.1:53}"
      LASTEST_DNS_WORDLIST_RATE: "${LASTEST_DNS_WORDLIST_RATE:-100}"
    ports:
      - target: 8080
        published: "${LASTEST_PORT:-8080}"
        host_ip: "${LASTEST_HOST_IP:-127.0.0.1}"
    volumes:
      - lastest-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: "${LASTEST_IMAGE:-ghcr.io/lasnet/lastest:dev}"
    command: ["worker"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LASTEST_DATA_DIR: /data
      LASTEST_DNS_SERVER: "${LASTEST_DNS_SERVER:-}"
      LASTEST_MAX_CONCURRENT_JOBS: "${LASTEST_MAX_CONCURRENT_JOBS:-4}"
      LASTEST_BIND: 127.0.0.1:8080
      LASTEST_INTERNAL_RANGES: "${LASTEST_INTERNAL_RANGES:-}"
      LASTEST_LOG_LEVEL: "${LASTEST_LOG_LEVEL:-info}"
      LASTEST_CERTSPOTTER_TOKEN: "${LASTEST_CERTSPOTTER_TOKEN:-}"
      LASTEST_CENSYS_API_ID: "${LASTEST_CENSYS_API_ID:-}"
      LASTEST_CENSYS_API_SECRET: "${LASTEST_CENSYS_API_SECRET:-}"
      LASTEST_CENSYS_PAT: "${LASTEST_CENSYS_PAT:-}"
      LASTEST_CENSYS_ORGANIZATION_ID: "${LASTEST_CENSYS_ORGANIZATION_ID:-}"
      LASTEST_CENSYS_PLATFORM_URL: "${LASTEST_CENSYS_PLATFORM_URL:-}"
      LASTEST_NMAP_PATH: "${LASTEST_NMAP_PATH:-}"
      LASTEST_SUBFINDER_PATH: "${LASTEST_SUBFINDER_PATH:-/usr/local/bin/subfinder}"
      LASTEST_DNSX_PATH: "${LASTEST_DNSX_PATH:-/usr/local/bin/dnsx}"
      LASTEST_DNS_WORDLIST_TIMEOUT_SECONDS: "${LASTEST_DNS_WORDLIST_TIMEOUT_SECONDS:-${LASTEST_DNSMAP_TIMEOUT_SECONDS:-7200}}"
      LASTEST_DNS_WORDLIST_RESOLVER: "${LASTEST_DNS_WORDLIST_RESOLVER:-1.1.1.1:53}"
      LASTEST_DNS_WORDLIST_RATE: "${LASTEST_DNS_WORDLIST_RATE:-100}"
    volumes:
      - lastest-data:/data
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  lastest-data:
    name: "${LASTEST_DATA_VOLUME:-lastest-data}"
