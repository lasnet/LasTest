name: LasTest

on:
  push:
    paths:
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "migrations/**"
      - "ui/**"
      - "tests/*.rs"
      - "tests/support/**"
      - "tests/fixtures/**"
      - "config/**"
      - "docs/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".env.example"
      - "scripts/e2e.sh"
      - ".github/workflows/lastest.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Release build
        run: cargo build --locked --release
      - name: Diff whitespace
        run: git diff --check
      - name: Compose configuration
        run: docker compose config -q

  image-amd64:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      published_image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Start temporary insecure registry for CI only
        run: |
          echo '{"insecure-registries":["localhost:5000"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker run -d --name lastest-e2e-registry -p 5000:5000 registry:2
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5000/v2/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Build image
        run: |
          docker build --pull -f Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t localhost:5000/lastest:ci .
      - name: Publish to temporary registry
        run: docker push localhost:5000/lastest:ci
      - name: Resolve immutable digest
        id: digest
        run: |
          IMAGE="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/lastest:ci)"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Compose pull/up/ps
        env:
          LASTEST_IMAGE: ${{ steps.digest.outputs.image }}
          LASTEST_PORT: "18080"
          LASTEST_SECURE_COOKIES: "false"
          LASTEST_INTERNAL_RANGES: "127.0.0.0/8"
        run: |
          docker compose config -q
          docker compose pull
          docker compose up -d --no-build
          docker compose ps
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health/ready
          docker compose down -v
      - name: End-to-end image scenario
        env:
          LASTEST_IMAGE: ${{ steps.digest.outputs.image }}
        run: ./scripts/e2e.sh

      - name: Publish the tested dev image to GHCR
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'lasnet/LasTest'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=ghcr.io/lasnet/lastest
          revision_tag="$image:sha-$GITHUB_SHA"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag localhost:5000/lastest:ci "$revision_tag"
          docker tag localhost:5000/lastest:ci "$image:dev"
          docker push "$revision_tag"
          docker push "$image:dev"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$revision_tag" | awk -v prefix="$image@" 'index($0, prefix)==1 {print; exit}')"
          [[ "$digest" == "$image"@sha256:* ]]
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'LasTest dev image for Linux amd64\n\n%s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  install-dev-amd64:
    runs-on: ubuntu-24.04
    needs: image-amd64
    if: needs.image-amd64.outputs.published_image != ''
    permissions:
      contents: read
      packages: read
    env:
      LASTEST_IMAGE: ${{ needs.image-amd64.outputs.published_image }}
      LASTEST_PORT: "18080"
      LASTEST_SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull and start the published image on a fresh runner
        run: |
          docker compose pull
          docker compose up -d --no-build --pull never
          docker compose ps
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health/ready
      - name: Run the installation smoke test
        run: ./scripts/e2e.sh
      - name: Remove CI services and data
        if: always()
        run: docker compose down -v

  image-arm64:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image (validation on arm64 host required before manifest)
        run: |
          docker buildx build --platform linux/arm64 \
            -f Dockerfile -t lastest:arm64-check .
